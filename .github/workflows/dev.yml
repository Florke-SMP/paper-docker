name: Development Image Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the development image
      run: |
        set -euo pipefail
        source .buildargs

        docker build \
          --build-arg PAPER_URL="${PAPER_URL}" \
          --build-arg SHA256="${SHA256}" \
          --build-arg JVM_FLAGS="${JVM_FLAGS}" \
          -t ghcr.io/florke-smp/paper:${LATEST_VERSION}-dev \
          -t ghcr.io/florke-smp/paper:dev \
          .

        docker push ghcr.io/florke-smp/paper:${LATEST_VERSION}-dev
        docker push ghcr.io/florke-smp/paper:dev

    - name: Docker system prune
      run: docker system prune -f
